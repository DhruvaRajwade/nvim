set -s escape-time 0
setw -g pane-base-index 1

set-option -g set-clipboard on


set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
#
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides "alacritty"

# Use modern terminal type with 256 colors and truecolor support
set-option -g default-terminal "tmux-256color"

# Enable truecolor (24-bit RGB) for all terminals
set-option -as terminal-overrides ",*:Tc"

# set -g default-terminal "screen-256color"
# set -as terminal-overrides ",alacritty:RGB"
# set-option -ga terminal-overrides ",xterm-256color:RGB"
#

set -g prefix C-q

set -g mouse on

set-window-option -g mode-keys vi

set-option -g renumber-windows on
set -g base-index 1 # start windows numbering at 1
set-option -g status-position top

####KEYBINDS####

unbind r
bind r source-file ~/.tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind + split-window -h \;\
         select-pane -L \;\
         split-window -v \;\
         select-pane -R \;\
         split-window -v \;\
         select-layout tiled

#bind + split-window -h \; select-pane -L \; split-window -v \; select-pane -R \; split-window -v


bind b if -F '#{==:#{status},on}' 'set -g status off' 'set -g status on'

set -g @tilish-navigate 'on'
set -g @tilish-prefix 'M-space'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

#Install `tpm` if needed.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"
set -g status-style bg=default


# run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
set -g @resurrect-dir '~/.config/tmux/plugins/tmux-resurrect/'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'
# run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
set -g @continuum-restore 'on'


