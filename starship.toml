command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
# success_symbol = '[➜](bold green)'
success_symbol = "[ ➤](bold green)"
error_symbol = "[ ➤]($bold fg:#fb4934)"


[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '
'dotfiles' = 'dots'


[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'



[package]
disabled = true

[golang]
format = '[ ](bold cyan)'




[line_break]
disabled = true


[docker_context]
disabled = true


[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )]($style)'
pyenv_version_name = true
pyenv_prefix = ''


[lua]
symbol = ' '

[time]
disabled = false
format = "[$time]($style) "
time_format = "%R"  # 24-hour format (HH:MM)
style = "dimmed yellow"



[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
