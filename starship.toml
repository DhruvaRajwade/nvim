# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right

# right_format = "$time"
# right_format = """$all"""
right_format = """
$username\
$hostname\
$localip\
$shlvl\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
